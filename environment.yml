name: signspark
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.10.0+cu128
    - torchvision==0.25.0+cu128
    - numpy==2.2.6
    - torchdiffeq==0.2.5
    - accelerate==1.10.1
    - transformers==4.56.1
    - "huggingface_hub<1.0"
    - sentence-transformers==5.1.2
    - multilingual-clip==1.0.10
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - einops==0.8.1
    - lmdb==2.2.0
    - scipy==1.15.3
    - matplotlib
    - blobfile==3.0.0
    - wandb==0.21.3
    - tqdm
    # Visualization / metrics (tools/visualize.py); SMPL-X models downloaded separately
    - smplx
    - trimesh
    - pyrender
    - opencv-python
